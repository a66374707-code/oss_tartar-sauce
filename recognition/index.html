<!DOCTYPE html>
<html><body>
<button onclick="init()">시작</button>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
<script>
const URL = "/model/my_pose/";

const ZONE_MAP = {
  "LU": 1, "MU": 2, "RU": 3,
  "LM": 4, "MM": 5, "RM": 6,
  "LD": 7, "MD": 8, "RD": 9
};

async function init() {
  const model = await tmPose.load(URL + "model.json", URL + "metadata.json");
  const webcam = new tmPose.Webcam(400, 400, true);
  await webcam.setup();
  await webcam.play();
  document.body.appendChild(webcam.canvas);

  async function loop() {
    webcam.update();
    const { posenetOutput } = await model.estimatePose(webcam.canvas);
    const p = await model.predict(posenetOutput);
    const best = p.reduce((a, b) => (a.probability > b.probability ? a : b));

    const zone = ZONE_MAP[best.className];
    document.getElementById("out").innerText =
      (zone !== undefined ? zone : best.className) + " " + best.probability.toFixed(2);

    await fetch("/result", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label: best.className, confidence: best.probability })
    });
    setTimeout(loop, 150);
  }
  loop();
}
</script>
</body></html>
